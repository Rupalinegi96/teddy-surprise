<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teddy Hug for Mohit ❤️</title>

<style>
    :root {
        --primary-pink: #ff4d6d;
        --soft-pink: #ff85a1;
        --dreamy-bg: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%);
    }

    body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', 'Segoe UI', sans-serif;
        background: var(--dreamy-bg);
        height: 100vh;
        overflow: hidden;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Dreamy Bokeh Background Effect */
    body::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
        z-index: 0;
    }

    .card {
        position: relative;
        z-index: 10;
        width: 85%;
        max-width: 500px;
        background: rgba(255, 255, 255, 0.15);
        padding: 40px;
        border-radius: 30px;
        backdrop-filter: blur(15px);
        border: 2px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        text-align: center;
        animation: floatCard 4s ease-in-out infinite;
    }

    h1 { font-size: 2.2rem; margin-bottom: 20px; text-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
    p { font-size: 1.1rem; line-height: 1.6; color: #fff; }

    button {
        margin-top: 25px;
        padding: 15px 35px;
        font-size: 18px;
        border-radius: 50px;
        border: none;
        background: white;
        color: var(--primary-pink);
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    button:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4);
    }

    /* Floating Heart Animations */
    .bg-hearts span {
        position: absolute;
        color: rgba(255, 255, 255, 0.6);
        filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
        z-index: 1;
        pointer-events: none;
        animation: floatUp 10s linear infinite;
    }

    @keyframes floatUp {
        0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateY(-20vh) scale(1.8); opacity: 0; }
    }

    @keyframes floatCard {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
    }

    /* Teddy Hug Section */
    .hug-container {
        position: fixed;
        bottom: 15%;
        left: 50%;
        transform: translateX(-50%);
        width: 300px;
        display: none;
        z-index: 20;
    }

    .teddy { width: 120px; transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .left { position: absolute; left: -50px; }
    .right { position: absolute; right: -50px; }

    .active-hug .left { left: 40px; }
    .active-hug .right { right: 40px; }

    .hug-message {
        position: fixed;
        bottom: 8%;
        width: 100%;
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        display: none;
        text-shadow: 0 0 10px white;
    }
</style>
</head>
<body>

<div class="bg-hearts">
    <span style="left:10%; font-size: 80px; animation-delay: 0s;">❤️</span>
    <span style="left:30%; font-size: 40px; animation-delay: 2s;">💖</span>
    <span style="left:55%; font-size: 100px; animation-delay: 4s;">❤️</span>
    <span style="left:80%; font-size: 60px; animation-delay: 1s;">💗</span>
    <span style="left:20%; font-size: 50px; animation-delay: 5s;">💕</span>
    <span style="left:70%; font-size: 90px; animation-delay: 3s;">❤️</span>
</div>

<div class="card">
    <h1>Happy Teddy Day Mohit ❤️</h1>
    <p>
        Just like every story needs its hero, my heart chose you — and I chose to be your teddy 💞
    </p>
    <p>
        Soft where you need comfort, warm when you need hugs, and always by your side.
    </p>
    <button onclick="startHug()">Click for a Teddy Hug 🧸💞</button>
</div>

<div class="hug-container" id="hugContainer">
    <img src="https://cdn-icons-png.flaticon.com/512/3233/3233486.png" class="teddy left" alt="teddy-left">
    <img src="https://cdn-icons-png.flaticon.com/512/3233/3233486.png" class="teddy right" style="transform: scaleX(-1);" alt="teddy-right">
</div>

<div class="hug-message" id="hugMsg">💖 Hug Delivered to Mohit! 💖</div>

<audio id="bgMusic">
    <source src="love.mp3" type="audio/mpeg">
</audio>

<script>
function startHug() {
    const hug = document.getElementById("hugContainer");
    const msg = document.getElementById("hugMsg");
    const music = document.getElementById("bgMusic");

    hug.style.display = "block";
    
    // Tiny delay to trigger the movement animation
    setTimeout(() => {
        hug.classList.add("active-hug");
    }, 100);

    // Play music (if browser allows)
    music.play().catch(e => console.log("Audio requires user interaction first."));

    setTimeout(() => {
        msg.style.display = "block";
    }, 1500);
}
</script>

</body>
</html>
