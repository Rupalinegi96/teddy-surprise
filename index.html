<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teddy Hug for Mohit</title>
<style>
    :root {
        --deep-rose: #720917;
        --soft-pink: #ff85a1;
        --accent: #ff4d6d;
        --petal: rgba(255, 182, 193, 0.6);
    }

    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at center, #3d141a 0%, #120507 100%);
    }

    /* Background Animation Container */
    #bg-canvas {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 1;
    }

    /* Glassmorphism Card */
    .card {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
        width: 85%;
        max-width: 450px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 30px;
        padding: 40px 25px;
        text-align: center;
        color: #fff;
        box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    h1 { font-size: 2.2rem; margin-bottom: 15px; color: var(--soft-pink); font-weight: 300; }
    p { font-size: 1.1rem; line-height: 1.6; opacity: 0.85; margin-bottom: 30px; }

    /* Loading Bar */
    .loading-container {
        display: none;
        margin: 20px auto;
        width: 220px;
    }
    .loading-text { font-size: 13px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--soft-pink); }
    .progress-bar {
        width: 100%;
        height: 8px;
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
        overflow: hidden;
    }
    .progress-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, var(--accent), #fff);
        transition: width 2.5s cubic-bezier(0.1, 0.5, 0.5, 1);
    }

    button {
        background: transparent;
        color: #fff;
        border: 1px solid var(--soft-pink);
        padding: 15px 35px;
        border-radius: 50px;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.4s ease;
    }
    button:hover { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 20px var(--accent); }

    /* Floating Petals/Glows */
    .petal-element {
        position: absolute;
        background: var(--petal);
        border-radius: 150% 0 150% 0; /* Petal shape */
        pointer-events: none;
        animation: drift linear infinite;
        filter: blur(2px);
    }

    @keyframes drift {
        0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
        15% { opacity: 0.5; }
        85% { opacity: 0.5; }
        100% { transform: translateY(-20vh) rotate(720deg); opacity: 0; }
    }

    /* Custom SVG Hug Icon */
    .hug-icon {
        width: 80px;
        height: 80px;
        fill: var(--soft-pink);
        display: none;
        margin: 20px auto 0;
        animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px var(--accent)); }
        50% { transform: scale(1.1); filter: drop-shadow(0 0 20px var(--accent)); }
    }
</style>
</head>
<body>

<div id="bg-canvas"></div>

<div class="card">
    <div id="content">
        <h1>Teddy Day for Mohit</h1>
        <p>You're the warmth in my winters and the softest place to land. Here's a little something for you...</p>
        <button onclick="startHug()">Receive Virtual Hug</button>
    </div>

    <div class="loading-container" id="loader">
        <div class="loading-text">Wrapping the warmth...</div>
        <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
    </div>

    <svg class="hug-icon" id="hugIcon" viewBox="0 0 24 24">
        <path d="M12,21.35L10.55,20.03C5.4,15.36 2,12.27 2,8.5C2,5.41 4.41,3 7.5,3C9.24,3 10.91,3.81 12,5.08C13.09,3.81 14.76,3 16.5,3C19.59,3 22,5.41 22,8.5C22,12.27 18.6,15.36 13.45,20.03L12,21.35Z"/>
    </svg>
    <p id="successMsg" style="display:none; margin-top:15px; font-weight:bold;">Hug Delivered!</p>
</div>

<script>
    const canvas = document.getElementById('bg-canvas');
    
    // Create floating rose petals
    function createPetals() {
        for(let i = 0; i < 30; i++) {
            const petal = document.createElement('div');
            petal.className = 'petal-element';
            
            const size = Math.random() * 15 + 10;
            petal.style.width = `${size}px`;
            petal.style.height = `${size}px`;
            petal.style.left = `${Math.random() * 100}%`;
            petal.style.animationDuration = `${Math.random() * 10 + 7}s`;
            petal.style.animationDelay = `${Math.random() * 5}s`;
            
            canvas.appendChild(petal);
        }
    }

    function startHug() {
        document.getElementById('content').style.display = 'none';
        document.getElementById('loader').style.display = 'block';
        
        const fill = document.getElementById('fill');
        setTimeout(() => { fill.style.width = '100%'; }, 100);

        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('hugIcon').style.display = 'block';
            document.getElementById('successMsg').style.display = 'block';
        }, 2600);
    }

    createPetals();
</script>

</body>
</html>
